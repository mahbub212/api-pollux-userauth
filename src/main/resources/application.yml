server:
  port: 9091

spring:
  profiles:
    active: dev
  application:
    name: api-pollux-userauth

eureka:
  instance:
    preferIpAddress: true
    hostname: api-pollux-userauth
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://eureka-0.eureka.cosmos.svc.cluster.local:8080/eureka,http://eureka-1.eureka.cosmos.svc.cluster.local:8080/eureka,http://eureka-2.eureka.cosmos.svc.cluster.local:8080/eureka,http://eureka-3.eureka.cosmos.svc.cluster.local:8080/eureka
      #defaultZone: http://localhost:8080/eureka

logging:
  level:
    org.springframework: ERROR
#    org.springframework.security: DEBUG
feign:
  client:
    config:
      default:
        connectTimeout: 160000000
        readTimeout: 160000000

custom:
  timeout:
    alert: 1500 # seconds
    actual: 1800 # seconds

# Konfigurasi untuk profil dev
---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:oracle:thin:@128.21.23.31:1521:AJSDB
    username: URSADEV
    password: kjZCbFRD
    driver-class-name: oracle.jdbc.driver.OracleDriver
    hikari:
      auto-commit: true
      idle-timeout: 10000
      maximum-pool-size: 5
      max-lifetime: 30000
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        #implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    database-platform: org.hibernate.dialect.Oracle12cDialect
    database: oracle
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  batch:
    job:
      enabled: false

